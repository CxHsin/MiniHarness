[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miniharness"
version = "0.2.1"
description = "A small OpenAI-backed local CLI coding agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
mh = "miniharness.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
